<path d="M315,192 L365,192" fill="none" stroke="url(#letterGrad)" stroke-width="19" stroke-linecap="round" style="fill:none;color:rgb(11, 11, 11);stroke-width:19px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

