<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">AW monogram, premium biru muda</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Squircle navy gelap dengan monogram interlock A dan W dalam gradient stroke biru muda.</desc>
<defs>
<clipPath id="squircleClip">
<rect x="180" y="40" width="320" height="320" rx="72" ry="72"/>
</clipPath>
<linearGradient id="letterGrad" x1="15%" y1="0%" x2="85%" y2="100%">
<stop offset="0%" stop-color="#F0F9FF"/>
<stop offset="45%" stop-color="#7DD3FC"/>
<stop offset="100%" stop-color="#0EA5E9"/>
</linearGradient>
</defs>

<rect x="180" y="40" width="320" height="320" rx="72" ry="72" fill="#101B36" style="fill:rgb(16, 27, 54);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<g clip-path="url(#squircleClip)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<polygon points="180,40 500,40 180,220" fill="#182648" style="fill:rgb(24, 38, 72);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</g>

<path d="M237,183 L288,276 L344,136 L400,276 L451,183" fill="none" stroke="#060B18" stroke-width="24" stroke-linecap="round" stroke-linejoin="miter" opacity="0.35" style="fill:none;stroke:rgb(6, 11, 24);color:rgb(11, 11, 11);stroke-width:24px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
